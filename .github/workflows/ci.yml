name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke test the pipeline offline
        # Proves the three steps work together without touching the network,
        # by pointing the pipeline at the small test fixture.
        run: |
          python -m src.run_pipeline \
            --source "file://$PWD/tests/fixtures/sample_confirmed.csv" \
            --raw-path /tmp/ci-raw.csv \
            --processed-path /tmp/ci-clean.csv \
            --db /tmp/ci-pipeline.db

      - name: Run the pipeline twice to prove it is idempotent
        run: |
          for i in 1 2; do
            python -m src.run_pipeline --skip-extract --quiet \
              --raw-path /tmp/ci-raw.csv \
              --processed-path /tmp/ci-clean.csv \
              --db /tmp/ci-pipeline.db
          done
          python -m src.run_pipeline --db /tmp/ci-pipeline.db --summary
