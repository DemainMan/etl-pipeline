name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: tests (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests with enforced coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=100

      - name: Smoke test the pipeline offline (confirmed)
        # Proves the three steps work together without touching the network,
        # by pointing the pipeline at the small test fixture.
        run: |
          python -m src.run_pipeline \
            --source "file://$PWD/tests/fixtures/sample_confirmed.csv" \
            --raw-path /tmp/ci-raw.csv \
            --processed-path /tmp/ci-clean.csv \
            --db /tmp/ci-pipeline.db

      - name: Smoke test the pipeline offline (deaths)
        run: |
          python -m src.run_pipeline --dataset deaths \
            --source "file://$PWD/tests/fixtures/sample_deaths.csv" \
            --raw-path /tmp/ci-deaths-raw.csv \
            --processed-path /tmp/ci-deaths-clean.csv \
            --db /tmp/ci-pipeline.db

      - name: Run the pipeline twice to prove it is idempotent
        run: |
          for i in 1 2; do
            python -m src.run_pipeline --skip-extract --quiet \
              --raw-path /tmp/ci-raw.csv \
              --processed-path /tmp/ci-clean.csv \
              --db /tmp/ci-pipeline.db
          done
          python -m src.run_pipeline --db /tmp/ci-pipeline.db --dataset all --summary

      - name: Report on both datasets
        run: |
          python -m src.run_pipeline --db /tmp/ci-pipeline.db --dataset all \
            --summary --report /tmp/ci-report.md
          cat /tmp/ci-report.md

      - name: Run the guided demo offline
        run: bash demo.sh --offline --no-pause
