name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: tests (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests with enforced coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=100

      - name: Smoke test the extract step offline
        run: |
          python -c "
          from pathlib import Path
          from src.extract import extract_from_url
          for name in ('confirmed', 'deaths'):
              url = (Path('tests/fixtures') / f'sample_{name}.csv').resolve().as_uri()
              print(extract_from_url(url, f'/tmp/ci-{name}-raw.csv'))
          "

      - name: Smoke test the transform step offline
        run: |
          python -c "
          from src.transform import transform
          for name in ('confirmed', 'deaths'):
              print(transform(f'/tmp/ci-{name}-raw.csv', f'/tmp/ci-{name}-clean.csv', dataset=name))
          "
